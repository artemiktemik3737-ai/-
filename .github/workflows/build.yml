
name: Build Aurora Visuals

on:
  push:
    paths:
      - 'aurora-visuals-1.21.4.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract source
        run: unzip -q aurora-visuals-1.21.4.zip -d source

      - name: Build mod
        run: gradle -p source/aurora-visuals build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: AuroraVisuals-JAR
          path: source/aurora-visuals/build/libs/*.jar
